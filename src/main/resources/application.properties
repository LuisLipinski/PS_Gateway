spring.application.name=ps-gateway
server.port=${PORT:8080}

app.services.login-url=${PS_LOGIN_URL:http://localhost:8084}
app.services.orchestrator-url=${PS_ORCHESTRATOR_URL:http://localhost:8085}
app.services.user-url=${PS_USER_URL:http://localhost:8083}
app.services.contrato-url=${PS_CONTRATO_URL:http://localhost:8082}
app.internal-key=${INTERNAL_API_KEY:local-development-key}
app.jwt.issuer=${JWT_ISSUER:ps-login}
# Default somente para desenvolvimento/testes. O profile prod exige JWT_SECRET_KEY explicitamente.
app.jwt.secret-key=${JWT_SECRET_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}
app.version=${APP_VERSION:0.0.1-SNAPSHOT}
app.git-commit=${GIT_COMMIT:dev}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
